name: Build KernelSU Kernel for Moto G30 (caprip)

on:
  push:
    branches:
      - lineage-23.2
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Kernel (caprip)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Cache Toolchains
        id: cache-toolchains
        uses: actions/cache@v4
        with:
          path: /home/runner/toolchains/clang
          key: toolchains-clang-r530567-v1

      - name: Setup Android 16 Clang Toolchain (clang-r530567)
        if: steps.cache-toolchains.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/toolchains/clang
          echo "Downloading Google Clang clang-r530567 (Android 16)..."
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-release/clang-r530567.tar.gz" | tar -xz -C /home/runner/toolchains/clang
          echo "Toolchain installed successfully."

      - name: Verify Toolchain Binaries
        run: |
          export PATH="/home/runner/toolchains/clang/bin:${PATH}"
          clang --version
          ld.lld --version
          llvm-as --version
          llvm-ar --version

      - name: Build Kernel
        run: |
          export PATH="/home/runner/toolchains/clang/bin:${PATH}"
          
          mkdir -p out
          
          echo "=== Using exact stock LineageOS 23.2 config with KernelSU-Next ==="
          cp arch/arm64/configs/vendor/caprip_ksu_defconfig out/.config
          
          echo "=== Running olddefconfig ==="
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          
          echo "=== Verifying KSU config symbols ==="
          grep "CONFIG_KSU=" out/.config || (echo "ERROR: CONFIG_KSU not found in .config" && exit 1)
          grep "CONFIG_KSU_MANUAL_HOOK=" out/.config || (echo "ERROR: CONFIG_KSU_MANUAL_HOOK not found in .config" && exit 1)
          
          echo "=== Building Kernel Image and DTBs with Android 16 LLVM ==="
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image dtbs
          
          if [ ! -s out/arch/arm64/boot/Image ]; then
            echo "ERROR: Kernel Image was not generated or is empty!"
            exit 1
          fi
          
          echo "Kernel Image built successfully: $(ls -lh out/arch/arm64/boot/Image)"

      - name: Package AnyKernel3 Zip
        id: package
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          ZIP_NAME="KernelSU-Next-caprip-LineageOS-23.2-${SHORT_SHA}.zip"
          chmod +x ./scripts/package_anykernel3.sh
          ./scripts/package_anykernel3.sh out "${ZIP_NAME}"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-caprip-LineageOS-23.2
          path: ./AnyKernel3/
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lineage-23.2-ksu-latest
          files: ${{ steps.package.outputs.zip_name }}
          name: "KernelSU-Next for Moto G30 (caprip) - LineageOS 23.2"
          body: |
            Flashable AnyKernel3 zip with KernelSU-Next for Motorola Moto G30 (caprip) on LineageOS 23.2 (Android 16).

            ### Flashing Instructions
            1. Download `${{ steps.package.outputs.zip_name }}` from the release assets below.
            2. Reboot into Custom Recovery (TWRP / OrangeFox / Lineage Recovery).
            3. Flash/sideload the zip file.
            4. Reboot into system and install the KernelSU-Next Manager app.
